[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "max-booking-bot"
version = "1.0.0"
description = "Универсальный бот записи для MAX: каждый пользователь делает свою страницу записи"
requires-python = ">=3.11"
dependencies = [
    "git+https://github.com/max-messenger/max-botapi-python.git",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
max-booking-bot = "bot.__main__:main"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.setuptools.package-data]
bot = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:bot.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "D", "ASYNC", "BLE"]
ignore = [
    "D203",   # конфликтует с D211
    "D213",   # конфликтует с D212
    "ANN401", # Any в обработчиках событий — осознанно
    # Правила ловят омофоны, а проект на русском: кириллица в строках
    # и типографское тире в «10:00–11:00» здесь совершенно законны.
    "RUF001",
    "RUF002",
    "RUF003",
    # Документируется всё, где читателю нужно сориентироваться: модули,
    # классы, функции с нетривиальным поведением. Короткие обёртки над SQL
    # вроде `repos.jobs.due()` своё имя уже объясняют — docstring перед
    # ними только разбавляет те, что действительно что-то поясняют.
    "D102",
    "D103",
    "D105", # `__repr__` и `__eq__` говорят сами за себя
    "D107", # у `__init__` репозиториев и сервисов тела в одну строку
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Тесты читаются как сценарии: имя `test_что_проверяем` уже объясняет
# назначение, а docstring перед каждым ассертом только шумит.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D107", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["bot"]
